<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniMatch — Higher-Education AI Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{--cream:#F6F3EC;--paper:#FFFFFF;--ink:#1B2A22;--forest:#1F3D2E;--moss:#5C7A63;--line:#E4DFD1;--amber:#C98A3B;--rose:#B65A4A;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;}
  .serif{font-family:'Fraunces',serif;}
</style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-[var(--line)] bg-[var(--paper)] sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="serif text-xl font-bold tracking-tight text-[var(--forest)]">UniMatch</span>
        <span class="text-xs bg-[var(--forest)]/10 text-[var(--forest)] px-2.5 py-0.5 rounded-full font-medium">Enterprise v2.6</span>
      </div>
      <nav class="flex items-center gap-6 text-sm font-medium">
        <button onclick="triggerOutreachStrategy()" class="text-[var(--moss)] hover:text-[var(--forest)] transition">Insight & Strategy</button>
        <button onclick="openTrainingModal()" class="bg-[var(--forest)] text-white px-4 py-2 rounded-xl text-xs font-semibold hover:bg-[var(--forest)]/90 transition shadow-sm">Train AI Engine</button>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full space-y-8">
    <div class="bg-white border border-[var(--line)] rounded-3xl p-8 shadow-sm">
      <h2 class="serif text-2xl font-bold text-[var(--forest)] mb-4">Student Matching & Evaluation Portal</h2>
      <form id="match-form" onsubmit="handleMatch(event)" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--moss)] mb-2">GPA (0.0 – 4.0)</label>
          <input type="number" id="gpa" step="0.01" min="0.0" max="4.0" value="3.75" required class="w-full bg-[var(--cream)] border border-[var(--line)] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[var(--forest)]">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--moss)] mb-2">SAT Score (400 – 1600)</label>
          <input type="number" id="sat" step="10" min="400" max="1600" value="1420" required class="w-full bg-[var(--cream)] border border-[var(--line)] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[var(--forest)]">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--moss)] mb-2">ACT Score (1 – 36)</label>
          <input type="number" id="act" step="1" min="1" max="36" value="32" required class="w-full bg-[var(--cream)] border border-[var(--line)] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[var(--forest)]">
        </div>
        <div class="md:col-span-3 flex justify-end">
          <button type="submit" class="bg-[var(--forest)] text-white font-semibold px-6 py-3 rounded-xl text-sm hover:bg-[var(--forest)]/90 transition">Evaluate Admissions Matrix</button>
        </div>
      </form>
    </div>

    <div id="results-container" class="space-y-4"></div>
  </main>

  <div id="training-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-8 border border-[var(--line)] shadow-xl relative space-y-6">
      <div class="flex justify-between items-center">
        <h3 class="serif text-xl font-bold text-[var(--forest)]">Contribute Data to Train AI</h3>
        <button onclick="closeTrainingModal()" class="text-gray-400 hover:text-black"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="training-form" onsubmit="submitTrainingData(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--moss)] mb-1">Contributor Name</label>
          <input type="text" id="train-name" placeholder="Alex Morgan" required class="w-full bg-[var(--cream)] border border-[var(--line)] rounded-xl px-4 py-2.5 text-sm">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--moss)] mb-1">GPA (0-4)</label>
            <input type="number" id="train-gpa" step="0.01" min="0.0" max="4.0" value="3.8" required class="w-full bg-[var(--cream)] border border-[var(--line)] rounded-xl px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--moss)] mb-1">SAT</label>
            <input type="number" id="train-sat" step="10" min="400" max="1600" value="1450" required class="w-full bg-[var(--cream)] border border-[var(--line)] rounded-xl px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--moss)] mb-1">ACT</label>
            <input type="number" id="train-act" step="1" min="1" max="36" value="32" required class="w-full bg-[var(--cream)] border border-[var(--line)] rounded-xl px-3 py-2 text-sm">
          </div>
        </div>
        <button type="submit" class="w-full bg-[var(--forest)] text-white py-3 rounded-xl font-semibold text-sm hover:bg-[var(--forest)]/90 transition">Submit to Model Training Pool</button>
      </form>
    </div>
  </div>

  <script>
    async function handleMatch(e) {
      e.preventDefault();
      const payload = {
        gpa: parseFloat(document.getElementById('gpa').value),
        sat: parseInt(document.getElementById('sat').value),
        act: parseInt(document.getElementById('act').value),
        major: 'Computer Science',
        region: 'Northeast',
        campus_type: 'Urban',
        dna: ['STEM', 'Research']
      };

      const res = await fetch('/api/match/student', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      
      const container = document.getElementById('results-container');
      container.innerHTML = `<h3 class="serif text-xl font-bold text-[var(--forest)]">Matching Results (${data.matches.length} Universities Indexed)</h3>` + 
        `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">` + 
        data.matches.map(m => `<div class="bg-white p-6 rounded-2xl border border-[var(--line)] space-y-2">
          <div class="flex justify-between font-bold"><span>${m.university}</span><span class="text-xs px-2 py-1 bg-emerald-100 text-emerald-800 rounded-full">${m.tier}</span></div>
          <p class="text-xs text-[var(--moss)]">Admit Probability: <strong>${m.probability}%</strong> · Region: ${m.region}</p>
          <p class="text-xs text-gray-600 italic">${m.reasoning}</p>
        </div>`).join('') + `</div>`;
    }

    async function triggerOutreachStrategy() {
      const res = await fetch('/api/advisor/outreach', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({min_gpa: 3.5, target_dna: ['STEM', 'Research']})
      });
      const data = await res.json();
      alert("Institutional Recruitment Strategy:\n\n" + (data.strategy || "Strategy parsed successfully."));
    }

    function openTrainingModal() { document.getElementById('training-modal').classList.remove('hidden'); document.getElementById('training-modal').classList.add('flex'); }
    function closeTrainingModal() { document.getElementById('training-modal').classList.remove('flex'); document.getElementById('training-modal').classList.add('hidden'); }

    async function submitTrainingData(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('train-name').value,
        gpa: parseFloat(document.getElementById('train-gpa').value),
        sat: parseInt(document.getElementById('train-sat').value),
        act: parseInt(document.getElementById('train-act').value),
        major: 'Computer Science',
        region: 'Northeast',
        campus_type: 'Urban',
        dna: ['STEM', 'Innovation']
      };
      const res = await fetch('/api/train/contribute', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      alert(data.message);
      closeTrainingModal();
    }
  </script>
</body>
</html>
